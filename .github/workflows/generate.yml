name: Generate Episode (TTS)

on:
  workflow_dispatch:
    inputs:
      episode_file:
        description: "Episode text file to synthesize"
        required: false
        default: "scripts/episodes/retina.txt"
      engine:
        description: "Engine: voxcpm | kokoro | auto"
        required: false
        default: "voxcpm"
      model_id:
        description: "VoxCPM checkpoint (openbmb/VoxCPM-0.5B = fast CPU · openbmb/VoxCPM2 = 48kHz flagship)"
        required: false
        default: "openbmb/VoxCPM-0.5B"
      inference_timesteps:
        description: "VoxCPM inference timesteps (4 = fast → 10 = quality)"
        required: false
        default: "8"
      cfg_value:
        description: "VoxCPM guidance scale (1.5–3.0)"
        required: false
        default: "2.0"
      kokoro_voice:
        description: "Kokoro voice id (fallback engine)"
        required: false
        default: "af_heart"

permissions:
  contents: write

concurrency:
  group: tts-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Install Python dependencies (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Synthesize episode
        run: |
          python scripts/generate_tts.py \
            --episode "${{ inputs.episode_file }}" \
            --engine "${{ inputs.engine }}" \
            --model-id "${{ inputs.model_id }}" \
            --timesteps "${{ inputs.inference_timesteps }}" \
            --cfg "${{ inputs.cfg_value }}" \
            --voice "${{ inputs.kokoro_voice }}" \
            --outdir output

      - name: Show outputs
        run: ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: |
            output/*.mp3
            output/*.wav
            output/*.meta.json
          retention-days: 30
          if-no-files-found: error

      - name: Commit audio back to repo
        run: |
          git config user.name  "tts-beta-fl-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "feat(audio): generated episode $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
