name: Focus Cast · Render Episodes (Kaggle GPU)

# FocusLinks Listen — Focus Cast by focuslinks — fully automated library factory:
#   1. Estimate the render time for the batch (calibrated estimator)
#   2. Push ONE Kaggle GPU kernel that renders every selected episode
#      (each script's '# Engine:' tag picks kokoro or voxcpm, voices from presets)
#   3. Pull the audio back into the library hierarchy:
#      rendered/series-NN-slug/season-NN-slug/ep-NN-title-slug/
#   4. Rebuild library/master.json (raw mp3 URLs + durations + all metadata)
#   5. Commit both + upload artifact + publish timing report

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episode scripts (repo paths, comma-separated). Default = full Season 1 + Season 2 batch (20 episodes)."
        required: false
        default: >-
          library/series/series-01-optometry-foundations/season-01/S01E01-what-is-optometry.txt,
          library/series/series-01-optometry-foundations/season-01/S01E02-what-does-an-optometrist-do.txt,
          library/series/series-01-optometry-foundations/season-01/S01E03-the-scope-of-optometric-practice.txt,
          library/series/series-01-optometry-foundations/season-01/S01E04-optometry-and-eye-care.txt,
          library/series/series-01-optometry-foundations/season-01/S01E05-optometrist-ophthalmologist-and-optician.txt,
          library/series/series-01-optometry-foundations/season-01/S01E06-the-optometrists-role-in-patient-care.txt,
          library/series/series-01-optometry-foundations/season-01/S01E07-major-areas-of-optometry.txt,
          library/series/series-01-optometry-foundations/season-01/S01E08-clinical-and-community-optometry.txt,
          library/series/series-01-optometry-foundations/season-01/S01E09-the-modern-optometry-practice.txt,
          library/series/series-01-optometry-foundations/season-01/S01E10-your-journey-through-optometry.txt,
          library/series/series-01-optometry-foundations/season-02/S02E01-why-do-we-have-eyes.txt,
          library/series/series-01-optometry-foundations/season-02/S02E02-from-light-to-vision.txt,
          library/series/series-01-optometry-foundations/season-02/S02E03-the-eye-as-an-optical-system.txt,
          library/series/series-01-optometry-foundations/season-02/S02E04-the-front-of-the-eye.txt,
          library/series/series-01-optometry-foundations/season-02/S02E05-the-back-of-the-eye.txt,
          library/series/series-01-optometry-foundations/season-02/S02E06-the-retina-as-the-sensory-layer.txt,
          library/series/series-01-optometry-foundations/season-02/S02E07-the-optic-nerve-and-visual-information.txt,
          library/series/series-01-optometry-foundations/season-02/S02E08-the-macula-and-central-vision.txt,
          library/series/series-01-optometry-foundations/season-02/S02E09-peripheral-vision.txt,
          library/series/series-01-optometry-foundations/season-02/S02E10-following-the-path-of-vision.txt
      engine:
        description: "auto = each script's '# Engine:' tag (recommended) | kokoro | voxcpm"
        required: false
        default: "auto"
      mp3_bitrate:
        description: "Library MP3 bitrate (96k mono recommended for spoken word)"
        required: false
        default: "96k"
      timesteps:
        description: "VoxCPM timesteps (only used if a script tags voxcpm)"
        required: false
        default: "10"
      cfg_value:
        description: "VoxCPM guidance scale (only used if a script tags voxcpm)"
        required: false
        default: "2.0"

permissions:
  contents: write

concurrency:
  group: focuscast-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle credentials (from encrypted repo secrets)
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Estimate render time (no Kaggle call)
        run: |
          EPISODES=$(echo "${{ inputs.episodes }}" | tr -d ' ')
          ARGS=""
          IFS=',' read -ra LIST <<< "$EPISODES"
          for f in "${LIST[@]}"; do ARGS="$ARGS --episode $f"; done
          python scripts/kaggle_render_driver.py --estimate-only \
            --engine "${{ inputs.engine }}" $ARGS > estimate.json
          cat estimate.json
          echo "### ⏱ Estimated before launch" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat estimate.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "(+0–5 min Kaggle queue)" >> "$GITHUB_STEP_SUMMARY"

      - name: Push kernel to Kaggle → wait for GPU render → pull audio into rendered/
        run: |
          EPISODES=$(echo "${{ inputs.episodes }}" | tr -d ' ')
          ARGS=""
          IFS=',' read -ra LIST <<< "$EPISODES"
          for f in "${LIST[@]}"; do ARGS="$ARGS --episode $f"; done
          python scripts/kaggle_render_driver.py \
            --engine "${{ inputs.engine }}" \
            --mp3-bitrate "${{ inputs.mp3_bitrate }}" \
            --timesteps "${{ inputs.timesteps }}" \
            --cfg "${{ inputs.cfg_value }}" \
            --slug focuscast-batch \
            --timeout-min 170 \
            --out rendered --no-wav $ARGS

      - name: Show deliverables
        run: find rendered -type f | sort

      - name: Rebuild library/master.json (raw URLs + durations + metadata)
        run: python scripts/update_master.py

      - name: Timing report (estimate vs actual)
        if: always()
        run: |
          if [ -f rendered/focuscast-batch.timing.json ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          t = json.load(open("rendered/focuscast-batch.timing.json"))
          print("### ⏱ Actual render timing")
          print("| metric | value |")
          print("|---|---|")
          print(f"| episodes | {t['episodes']} |")
          print(f"| words total | {t['words_total']} |")
          print(f"| estimated render | {t['eta_render_min']} min |")
          print(f"| actual push→complete | {t['actual_push_to_complete_min']} min |")
          print(f"| total incl. download | {t['actual_total_min']} min |")
          print(f"| delivered | {len(t.get('delivered', []))} episode(s) |")
          print(f"\nKernel: https://www.kaggle.com/code/{t['kernel']}")
          PY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focuscast-episodes
          path: |
            rendered/**/*.mp3
            rendered/**/*.meta.json
            rendered/*.timing.json
            library/master.json
          retention-days: 30
          if-no-files-found: error

      - name: Commit rendered audio + master.json back to repo
        run: |
          git config user.name  "focuscast-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered/ library/master.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "feat(audio): Focus Cast render — ${{ inputs.episodes }} [skip ci]"
            git pull --rebase origin main
            git push
          fi
