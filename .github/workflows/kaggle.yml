name: Render Episode (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      episode_file:
        description: "Episode text file (repo path)"
        required: false
        default: "scripts/episodes/cochlea.txt"
      engine:
        description: "Engine: voxcpm | kokoro"
        required: false
        default: "voxcpm"
      model_id:
        description: "VoxCPM checkpoint (VoxCPM2 = 48kHz flagship, recommended on GPU)"
        required: false
        default: "openbmb/VoxCPM2"
      inference_timesteps:
        description: "VoxCPM timesteps (GPU default 10 = quality)"
        required: false
        default: "10"
      cfg_value:
        description: "Guidance scale (1.5–3.0)"
        required: false
        default: "2.0"

permissions:
  contents: write

concurrency:
  group: kaggle-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle credentials (from encrypted repo secrets)
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Push kernel to Kaggle → wait for GPU render → pull audio back
        run: |
          python scripts/kaggle_render_driver.py \
            --episode "${{ inputs.episode_file }}" \
            --engine "${{ inputs.engine }}" \
            --model-id "${{ inputs.model_id }}" \
            --timesteps "${{ inputs.inference_timesteps }}" \
            --cfg "${{ inputs.cfg_value }}" \
            --out output

      - name: Show outputs
        run: ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-episode-audio
          path: |
            output/*.mp3
            output/*.wav
            output/*.meta.json
          retention-days: 30
          if-no-files-found: error

      - name: Commit audio back to repo
        run: |
          git config user.name  "tts-beta-fl-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "feat(audio): Kaggle GPU render — ${{ inputs.episode_file }} [skip ci]"
            git push
          fi
